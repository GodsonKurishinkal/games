<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sound Match Safari - KG1 Game</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            touch-action: manipulation; /* Prevents double-tap zoom on mobile */
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            overflow: hidden; /* Keep it contained like an app */
        }

        /* Fun animations */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        @keyframes bounce-in {
            0% { transform: scale(0.1); opacity: 0; }
            60% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            50% { box-shadow: 0 0 20px 10px rgba(255, 215, 0, 0); }
        }
        @keyframes happy-jump {
            0%, 100% { transform: translateY(0) scale(1); }
            30% { transform: translateY(-30px) scale(1.1) rotate(10deg); }
            50% { transform: translateY(-40px) scale(1.1) rotate(-10deg); }
            70% { transform: translateY(-10px) scale(1.05) rotate(5deg); }
        }
        @keyframes float-rotate {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(2deg); }
        }
        @keyframes button-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-bounce-in { animation: bounce-in 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        .animate-shake { animation: shake 0.5s ease-in-out; }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        .animate-happy-jump { animation: happy-jump 1s cubic-bezier(0.28, 0.84, 0.42, 1); }
        .animate-float-rotate { animation: float-rotate 4s ease-in-out infinite; }
        .animate-button-pulse { animation: button-pulse 2s ease-in-out infinite; }
        @keyframes drift-up {
            0% { transform: translateY(100vh) scale(0.8); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes slide-up-fade {
            0% { transform: translateY(50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-3deg); }
            75% { transform: rotate(3deg); }
        }

        .animate-drift-up { animation: drift-up 15s linear infinite; }
        .animate-breathe { animation: breathe 3s ease-in-out infinite; }
        .animate-slide-up { animation: slide-up-fade 0.5s ease-out both; }
        .hover-wiggle:hover { animation: wiggle 0.5s ease-in-out infinite; }

        /* Shatter Animation Classes */
        .shatter-piece {
            position: absolute;
            background-color: inherit;
            border: 2px solid inherit;
            /* Give pieces some depth */
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }

        @keyframes fall-and-fade {
            0% { 
                transform: translate(0, 0) rotate(0deg); 
                opacity: 1; 
            }
            100% { 
                transform: translate(var(--fall-x), var(--fall-y)) rotate(var(--fall-rot)); 
                opacity: 0; 
            }
        }
        
        .animate-shatter {
            animation: fall-and-fade 1s cubic-bezier(0.55, 0.085, 0.68, 0.53) forwards;
        }

        /* Cloud Background styling */
        .cloud {
            position: absolute;
            background: white;
            border-radius: 200px;
            opacity: 0.8;
            z-index: -1;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 50%;
        }
        
        /* Interactive Game Cards */
        .game-card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 8px 0px #cbd5e1;
            transform-style: preserve-3d;
        }
        .game-card:active {
            transform: translateY(8px) scale(0.95);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1), 0 0px 0px #cbd5e1;
        }
        .game-card:hover {
            transform: translateY(-8px) scale(1.02) rotate(-1deg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.04), 0 8px 0px #cbd5e1;
            filter: brightness(1.05);
        }

        /* Target Card - slightly different styling */
        .target-card {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 15px 0px #93c5fd;
            transition: transform 0.3s ease;
        }
        .target-card:hover {
            transform: scale(1.05);
        }

        /* Sparkle trail */
        .sparkle {
            position: absolute;
            pointer-events: none;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background-color: yellow;
            box-shadow: 0 0 15px yellow, 0 0 20px white;
            z-index: 100;
            /* Zoom animation instead of shrinking */
            animation: sparkle-zoom 0.8s ease-out forwards;
        }
        @keyframes sparkle-zoom {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.2); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.5); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(3.5); }
        }

        .mini-star {
            position: absolute;
            pointer-events: none;
            font-size: 20px;
            z-index: 100;
            animation: star-burst 0.8s ease-out forwards;
        }
        @keyframes star-burst {
            0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative cursor-crosshair">

    <!-- Decorative Clouds -->
    <div class="cloud w-32 h-10 top-10 left-10 animate-float-rotate" style="animation-delay: 0s;"></div>
    <div class="cloud w-48 h-16 top-32 right-10 animate-float" style="animation-delay: 1s;"></div>
    <div class="cloud w-24 h-8 bottom-40 left-20 animate-float-rotate" style="animation-delay: 2s;"></div>
    <div class="cloud w-40 h-12 bottom-20 right-24 animate-float" style="animation-delay: 0.5s;"></div>

    <!-- Floating Balloons Background -->
    <div class="absolute text-5xl opacity-50 animate-drift-up" style="left: 10%; animation-duration: 18s; animation-delay: 0s;">🎈</div>
    <div class="absolute text-6xl opacity-40 animate-drift-up" style="left: 85%; animation-duration: 22s; animation-delay: 4s;">🎈</div>
    <div class="absolute text-4xl opacity-60 animate-drift-up" style="left: 30%; animation-duration: 15s; animation-delay: 7s;">🎈</div>
    <div class="absolute text-5xl opacity-50 animate-drift-up" style="left: 60%; animation-duration: 20s; animation-delay: 2s;">🎈</div>

    <!-- START SCREEN -->
    <div id="start-screen" class="flex flex-col items-center justify-center w-full h-full absolute z-50 bg-white/40 backdrop-blur-sm transition-opacity duration-500">
        <div class="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-lg mx-4 border-4 border-yellow-400 animate-bounce-in">
            <h1 class="text-5xl font-black text-blue-600 mb-6 tracking-wide drop-shadow-md">Sound Match!</h1>
            <div class="text-8xl mb-8 animate-float">🌟</div>
            <p class="text-2xl text-gray-700 mb-8 font-bold">Help Starry find the words that sound the same!</p>
            <button id="start-btn" class="text-3xl bg-green-500 hover:bg-green-400 text-white font-black py-6 px-12 rounded-full shadow-[0_8px_0_#16a34a] hover:shadow-[0_4px_0_#16a34a] hover:translate-y-1 active:shadow-[0_0px_0_#16a34a] active:translate-y-2 transition-all w-full animate-button-pulse">
                PLAY! ▶️
            </button>
        </div>
    </div>

    <!-- GAME UI -->
    <div id="game-ui" class="w-full max-w-4xl h-full flex flex-col hidden px-4 py-6">
        
        <!-- Header: Score and Progress -->
        <div class="flex justify-between items-center w-full mb-4">
            <div class="bg-white/80 rounded-full px-6 py-2 shadow-md flex items-center gap-2 border-2 border-blue-200">
                <span class="text-2xl">⭐</span>
                <span id="score-display" class="text-3xl font-black text-blue-600">0</span>
            </div>
            <div id="progress-dots" class="flex gap-2">
                <!-- Dots added by JS -->
            </div>
        </div>

        <!-- Character Area -->
        <div class="flex-grow flex flex-col items-center justify-center w-full relative">
            <div id="character" class="text-7xl mb-4 z-10 transition-transform duration-300 animate-float drop-shadow-xl animate-breathe">
                🌟
            </div>
            
            <!-- The Word to Rhyme -->
            <div class="w-full flex justify-center mb-10 z-20">
                <div id="target-container" class="bg-blue-100 border-4 border-blue-400 rounded-3xl p-6 flex flex-col items-center justify-center w-64 h-64 target-card animate-pulse-glow">
                    <span class="text-gray-500 font-bold text-xl uppercase tracking-wider mb-2">Sounds like...</span>
                    <div id="target-icon" class="text-8xl drop-shadow-md mb-2 transition-transform duration-300 hover:scale-110 hover:-rotate-12">🐱</div>
                    <div id="target-word" class="text-4xl font-black text-blue-800 tracking-wide">CAT</div>
                </div>
            </div>

            <!-- Options to choose from -->
            <div id="options-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full z-20">
                <!-- Option Buttons generated by JS -->
            </div>
        </div>
    </div>

    <!-- END SCREEN -->
    <div id="end-screen" class="flex flex-col items-center justify-center w-full h-full absolute z-50 bg-white/40 backdrop-blur-sm hidden">
        <div class="bg-white p-10 rounded-3xl shadow-2xl text-center max-w-lg mx-4 border-4 border-green-400 animate-bounce-in">
            <h1 class="text-6xl font-black text-green-500 mb-6 drop-shadow-md">You Did It!</h1>
            <div class="text-9xl mb-8 animate-happy-jump">🏆</div>
            <p class="text-3xl text-gray-700 mb-8 font-bold">You are a Sound Master!</p>
            <button id="restart-btn" class="text-3xl bg-blue-500 hover:bg-blue-400 text-white font-black py-6 px-12 rounded-full shadow-[0_8px_0_#2563eb] hover:shadow-[0_4px_0_#2563eb] hover:translate-y-1 active:shadow-[0_0px_0_#2563eb] active:translate-y-2 transition-all w-full animate-button-pulse">
                PLAY AGAIN 🔄
            </button>
        </div>
    </div>

    <script>
        // --- DATA DICTIONARY ---
        // carefully selected, ultra-simple KG1-appropriate matching pairs for UAE context
        const allLevels = [
            { target: { w: "CAT", i: "🐱" }, correct: { w: "HAT", i: "🎩" }, wrong: [{ w: "DOG", i: "🐶" }, { w: "CAR", i: "🚗" }, { w: "SUN", i: "☀️" }] },
            { target: { w: "FOX", i: "🦊" }, correct: { w: "BOX", i: "📦" }, wrong: [{ w: "BUG", i: "🐛" }, { w: "COW", i: "🐮" }, { w: "ANT", i: "🐜" }] },
            { target: { w: "BUG", i: "🐛" }, correct: { w: "MUG", i: "☕" }, wrong: [{ w: "BIRD", i: "🐦" }, { w: "FISH", i: "🐟" }, { w: "TREE", i: "🌳" }] },
            { target: { w: "CAR", i: "🚗" }, correct: { w: "STAR", i: "⭐" }, wrong: [{ w: "BEE", i: "🐝" }, { w: "HAT", i: "🎩" }, { w: "BED", i: "🛏️" }] },
            { target: { w: "SUN", i: "☀️" }, correct: { w: "BUN", i: "🍔" }, wrong: [{ w: "STAR", i: "⭐" }, { w: "MOON", i: "🌙" }, { w: "CAR", i: "🚗" }] },
            { target: { w: "BEE", i: "🐝" }, correct: { w: "TREE", i: "🌳" }, wrong: [{ w: "DUCK", i: "🦆" }, { w: "CAT", i: "🐱" }, { w: "SHOE", i: "👞" }] },
            { target: { w: "MOUSE", i: "🐭" }, correct: { w: "HOUSE", i: "🏠" }, wrong: [{ w: "CHEESE", i: "🧀" }, { w: "BALL", i: "⚽" }, { w: "SUN", i: "☀️" }] },
            { target: { w: "HEN", i: "🐔" }, correct: { w: "PEN", i: "🖊️" }, wrong: [{ w: "HONEY", i: "🍯" }, { w: "DOOR", i: "🚪" }, { w: "HAT", i: "🎩" }] },
            { target: { w: "SNAKE", i: "🐍" }, correct: { w: "CAKE", i: "🎂" }, wrong: [{ w: "FROG", i: "🐸" }, { w: "APPLE", i: "🍎" }, { w: "BED", i: "🛏️" }] },
            { target: { w: "DUCK", i: "🦆" }, correct: { w: "TRUCK", i: "🚛" }, wrong: [{ w: "FISH", i: "🐟" }, { w: "BOAT", i: "⛵" }, { w: "TREE", i: "🌳" }] }
        ];

        // --- STATE VARIABLES ---
        let currentLevelIndex = 0;
        let score = 0;
        let activeLevels = [];
        const TOTAL_ROUNDS = 5; // How many rounds per game to keep it short & sweet
        let isAnimating = false; // Prevent clicking during animations

        // --- AUDIO SYNTHESIZER ---
        // Using Web Audio API to create sounds without external assets
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, duration, vol=0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = type;
            oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + duration);
        }

        function playSuccessSound() {
            // A happy upward arpeggio
            playTone(523.25, 'sine', 0.2, 0.2); // C5
            setTimeout(() => playTone(659.25, 'sine', 0.2, 0.2), 100); // E5
            setTimeout(() => playTone(783.99, 'sine', 0.4, 0.2), 200); // G5
        }

        function playFailSound() {
            // A gentle, soft downward boop
            playTone(300, 'triangle', 0.3, 0.2);
            setTimeout(() => playTone(250, 'triangle', 0.4, 0.2), 150);
        }

        function playPopSound() {
            // Very short pop for clicking
            playTone(800, 'sine', 0.1, 0.1);
        }

        function playWinGameSound() {
            // Grand finale sound
            playSuccessSound();
            setTimeout(() => playSuccessSound(), 400);
            setTimeout(() => {
                playTone(1046.50, 'square', 0.6, 0.1); // C6
            }, 800);
        }

        // --- UTILITY FUNCTIONS ---
        // Shuffle an array (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // --- GAME LOGIC ---

        function initGame() {
            score = 0;
            currentLevelIndex = 0;
            updateScore();
            
            // Pick random levels for this session
            activeLevels = shuffle([...allLevels]).slice(0, TOTAL_ROUNDS);
            
            // Setup progress dots
            const progressContainer = document.getElementById('progress-dots');
            progressContainer.innerHTML = '';
            for(let i=0; i<TOTAL_ROUNDS; i++) {
                const dot = document.createElement('div');
                dot.className = 'w-4 h-4 rounded-full bg-blue-200 border-2 border-white transition-colors duration-300';
                dot.id = `dot-${i}`;
                progressContainer.appendChild(dot);
            }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            document.getElementById('game-ui').classList.remove('hidden');
            
            loadLevel();
        }

        function loadLevel() {
            isAnimating = false;
            const levelData = activeLevels[currentLevelIndex];
            
            // Update Progress dots
            for(let i=0; i<TOTAL_ROUNDS; i++) {
                const dot = document.getElementById(`dot-${i}`);
                if (i < currentLevelIndex) {
                    dot.classList.replace('bg-blue-200', 'bg-green-400');
                } else if (i === currentLevelIndex) {
                    dot.classList.replace('bg-blue-200', 'bg-yellow-400');
                    dot.classList.add('animate-pulse');
                } else {
                    dot.classList.remove('animate-pulse');
                }
            }

            // Set Target
            const targetContainer = document.getElementById('target-container');
            targetContainer.classList.remove('animate-bounce-in');
            // Trigger reflow to restart animation
            void targetContainer.offsetWidth;
            targetContainer.classList.add('animate-bounce-in');

            document.getElementById('target-icon').textContent = levelData.target.i;
            document.getElementById('target-word').textContent = levelData.target.w;

            // Prepare Options (1 correct, 2 randomly chosen wrongs)
            const wrongs = shuffle([...levelData.wrong]).slice(0, 2);
            const options = shuffle([levelData.correct, ...wrongs]);

            // Render Options
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            options.forEach((opt, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'animate-slide-up h-56 w-full';
                wrapper.style.animationDelay = `${index * 0.15}s`;

                const btn = document.createElement('div');
                // Vibrant colors for each button
                const colors = [
                    'bg-pink-100 border-pink-400 text-pink-800 shadow-[0_8px_0_#f472b6]',
                    'bg-green-100 border-green-400 text-green-800 shadow-[0_8px_0_#4ade80]',
                    'bg-purple-100 border-purple-400 text-purple-800 shadow-[0_8px_0_#c084fc]'
                ];
                
                btn.className = `game-card border-4 rounded-3xl p-6 flex flex-col items-center justify-center h-full w-full hover-wiggle ${colors[index]}`;
                
                btn.innerHTML = `
                    <div class="text-7xl mb-4 pointer-events-none drop-shadow-md">${opt.i}</div>
                    <div class="text-3xl font-black pointer-events-none">${opt.w}</div>
                `;
                
                btn.onclick = () => handleAnswer(opt, levelData.correct, btn);
                wrapper.appendChild(btn);
                optionsContainer.appendChild(wrapper);
            });

            // Reset Character
            const char = document.getElementById('character');
            char.textContent = "🌟";
            char.className = "text-7xl mb-4 z-10 transition-transform duration-300 animate-float drop-shadow-xl animate-breathe";
        }

        function createLocalBurst(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            for(let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.textContent = "⭐";
                star.className = 'mini-star';
                star.style.left = centerX + 'px';
                star.style.top = centerY + 'px';
                
                // Random outward trajectory
                const angle = (Math.PI * 2 / 8) * i;
                const distance = 50 + Math.random() * 50;
                star.style.setProperty('--tx', `${Math.cos(angle) * distance}px`);
                star.style.setProperty('--ty', `${Math.sin(angle) * distance}px`);
                
                document.body.appendChild(star);
                
                setTimeout(() => star.remove(), 800);
            }
        }

        function handleAnswer(selected, correct, btnElement) {
            if(isAnimating) return;
            playPopSound();

            const char = document.getElementById('character');

            if (selected.w === correct.w) {
                // CORRECT ANSWER
                isAnimating = true;
                score += 10;
                updateScore();
                playSuccessSound();

                // Happy Character Reaction
                char.textContent = "🤩";
                char.classList.remove('animate-float');
                char.classList.add('animate-happy-jump');

                // Button visual feedback
                btnElement.classList.replace('border-pink-400', 'border-yellow-400');
                btnElement.classList.replace('border-green-400', 'border-yellow-400');
                btnElement.classList.replace('border-purple-400', 'border-yellow-400');
                btnElement.classList.remove('hover-wiggle');
                btnElement.classList.add('bg-yellow-200');
                
                // Make the chosen button pop out playfully
                btnElement.style.transform = 'scale(1.1) rotate(5deg)';
                btnElement.style.zIndex = '50';

                createLocalBurst(btnElement);

                // Fire Confetti!
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#FFD700', '#FF69B4', '#00FF00', '#00BFFF']
                });

                // Next Level after delay
                setTimeout(() => {
                    currentLevelIndex++;
                    if(currentLevelIndex < TOTAL_ROUNDS) {
                        loadLevel();
                    } else {
                        endGame();
                    }
                }, 1500);

            } else {
                // WRONG ANSWER
                playFailSound();
                char.textContent = "🤔"; // Thinking face
                
                shatterElement(btnElement);
            }
        }

        function shatterElement(element) {
            // Prevent further clicks on this element's wrapper
            element.parentElement.style.pointerEvents = 'none';

            // Get the element's dimensions and computed styles
            const rect = element.getBoundingClientRect();
            const computedStyle = window.getComputedStyle(element);
            const bgColor = computedStyle.backgroundColor;
            const borderColor = computedStyle.borderColor;
            
            // We need to append the pieces relative to the wrapper to keep them in place before falling
            const wrapper = element.parentElement;
            
            // Hide the original element completely
            element.style.visibility = 'hidden';

            // Create pieces (a grid of 3x3 for simplicity, but looks good)
            const rows = 3;
            const cols = 3;
            const pieceWidth = rect.width / cols;
            const pieceHeight = rect.height / rows;

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols; j++) {
                    const piece = document.createElement('div');
                    piece.className = 'shatter-piece rounded-md';
                    
                    // Style the piece to look like a fragment of the original
                    piece.style.width = `${pieceWidth}px`;
                    piece.style.height = `${pieceHeight}px`;
                    piece.style.left = `${j * pieceWidth}px`;
                    piece.style.top = `${i * pieceHeight}px`;
                    piece.style.backgroundColor = bgColor;
                    piece.style.borderColor = borderColor;
                    piece.style.borderWidth = '2px';
                    piece.style.borderStyle = 'solid';
                    
                    // Copy some inner HTML content if it falls near the center (optional, keeps it simple without for now)
                    
                    // Randomize the fall trajectory
                    const fallX = (Math.random() - 0.5) * 200; // -100 to 100px horizontally
                    const fallY = 150 + Math.random() * 200;   // 150 to 350px downwards
                    const fallRot = (Math.random() - 0.5) * 360; // Random rotation

                    piece.style.setProperty('--fall-x', `${fallX}px`);
                    piece.style.setProperty('--fall-y', `${fallY}px`);
                    piece.style.setProperty('--fall-rot', `${fallRot}deg`);

                    // Add the animation class
                    piece.classList.add('animate-shatter');

                    // Add to wrapper
                    wrapper.appendChild(piece);
                    
                    // Clean up pieces after animation
                    setTimeout(() => {
                        if(piece.parentNode) piece.parentNode.removeChild(piece);
                    }, 1000);
                }
            }
        }

        function updateScore() {
            const scoreEl = document.getElementById('score-display');
            scoreEl.textContent = score;
            scoreEl.classList.remove('animate-bounce-in');
            void scoreEl.offsetWidth; // trigger reflow
            scoreEl.classList.add('animate-bounce-in');
        }

        function endGame() {
            document.getElementById('game-ui').classList.add('hidden');
            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');
            
            playWinGameSound();
            
            // Big Confetti
            const duration = 3000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#FFD700', '#FF69B4']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#00FF00', '#00BFFF']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // --- EVENT LISTENERS ---
        document.getElementById('start-btn').addEventListener('click', () => {
            // Need to initialize AudioContext on first user interaction
            if(audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            playPopSound();
            initGame();
        });

        document.getElementById('restart-btn').addEventListener('click', () => {
            playPopSound();
            initGame();
        });

        // --- MOUSE SPARKLE TRAIL ---
        document.addEventListener('mousemove', function(e) {
            // Show sparkles more frequently for a fun zooming trail effect!
            if(Math.random() > 0.4) return;
            
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            // Center the sparkle exactly on the mouse coordinates
            sparkle.style.left = e.pageX + 'px';
            sparkle.style.top = e.pageY + 'px';
            
            // Randomize color slightly for a fiery magical trail
            const colors = ['yellow', 'gold', '#ffeb3b', '#fff59d', '#ff9800'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            sparkle.style.backgroundColor = color;
            sparkle.style.boxShadow = `0 0 15px ${color}, 0 0 25px white`;

            document.body.appendChild(sparkle);

            // Remove sparkle after zoom animation completes
            setTimeout(() => {
                sparkle.remove();
            }, 800);
        });

    </script>
</body>
</html>
